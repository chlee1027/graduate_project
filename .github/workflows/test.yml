# push 와 PR 마다 서버 시험(pytest)과 화면 타입 검사(tsc)를 돌린다.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest tests -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # PR 에서는 output.css 를 다시 만들지 않고, 최신이 아니면 알려 준다(main 에서는 css 워크플로가 고친다)
      - name: output.css is up to date
        if: github.event_name == 'pull_request'
        run: npm run css && git diff --exit-code -- output.css
